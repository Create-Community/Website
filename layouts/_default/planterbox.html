{{ define "main" }}

<section class="section blog-single py-5">
  <div class="" style="margin-left: 10%; margin-right: 10%">
    <div class="row justify-content-center">
      <div class="col-9">
        {{ with .Title }}
        <h2 class="page-title display-3 fw-bold text-center text-primary pb-3">
          {{ . }}
        </h2>
        {{ end }} {{ with .Params.description }}
        <p class="text-black-61 text-center">{{ . }}</p>
        {{ end }}
      </div>
    </div>

    <div class="row mb-5">
      <div class="col-12 justify-content-center">
        <div class="blog-content fs-5 mx-auto" style="text-align: center;">{{ .Content }}</div>
      </div>
    </div>
    <div class="blog-content fs-5 mx-auto" style="text-align: left;">You can follow along with our step-by-step guide below:</div>
  <div class="row  justify-content-center mb-5" >
    <div style="position: relative; width: 50%; height: 0; padding-top: 64.54%;

    border-radius: 8px; will-change: transform;">
      <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;            border: solid 5px #ffba42;
              border-radius: 8px;"
        src="https://www.canva.com/design/DAHOA5y7ihM/sOWzExg2lCJYNjy3_R0OTw/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">

    </div>
  </div>

            "
          />
        </div>
      </div>

      <div class="container col-6">
        <div
          class="col-auto"
          style="justify-content: center; display: grid;
            height: 100%;"
        >

        max-height: 100vh; margin: auto;"
        >
         <a href="https://maps.app.goo.gl/mB3JuVHowUZzbCbx8">

            height="100%"

              border-radius: 8px;
              min-width: 300px;box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          /></image></a>
          <div style="text-align: center;">
            <h4>

            </h4>

        </div></div>

    </div>
