{{ define "main" }}

<section class="section blog-single py-5">
  <div class="" style="margin-left: 10%; margin-right: 10%">
    <div class="row justify-content-center">
      <div class="col-9">
        {{ with .Title }}
        <h2 class="page-title display-3 fw-bold text-center text-primary pb-3">
          {{ . }}
        </h2>
        {{ end }} {{ with .Params.description }}
        <p class="text-black-61 text-center">{{ . }}</p>
        {{ end }}
      </div>
    </div>

    <div class="row pb-5">
      <div class="col-12 justify-content-center">
        <div class="blog-content fs-5 mx-auto" style="text-align: center;">{{ .Content }}</div>
      </div>
    </div>

    <div class="row flex-column flex-xl-row">
      <div class="container col-6">
        <div
          class="col-auto"
          style="display: flex; justify-content: center;
            margin:20px"
        >
          <img
            src="/images/planterbox.png"
            alt="event-poster"
            style="
              width: 80%;
              aspect-ratio: 17/22;
              border-style: solid;
              border-width: 5px;
              border-color: gold;
              border-radius: 8px;min-width: 300px;
            "
          />
        </div>
      </div>

      <div class="container col-6">
        <div
          class="col-auto"
          style="justify-content: center; display: grid;
            height: 100%;"
        >
        <div   style="justify-content: center; max-width: 100%;
        max-height: 100vh;
        margin: auto;">
          <image
            src="https://maps.googleapis.com/maps/api/staticmap?center=49.92072914338066,-119.44268072882544&zoom=15&size=500x500&markers=color:red%7Clabel:CC%7C49.92072914338066,-119.44268072882544&key=AIzaSyBZw-2Vtdw6g7k0vpf2IZwV6goEhcQGnvw&signature=pJXw1F7qaU7_u8cl-k_Ejr67aig="
            width="100%"
            height="500"
            style="
              border-style: solid;
              border-width: 5px;
              border-color: gold;
              border-radius: 8px;min-width: 300px;
            "
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          /></image>
          <div style="text-align: center;">
            <h4>
              The exact location of the event is in the cul-de-sac
              <a href="https://maps.app.goo.gl/Jxqyg7SnKa61DfvB8">here</a>!
            </h4>
          </div>
        </div></div>
      </div>
