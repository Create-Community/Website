# "/workspaces/" details each currently open workspace/partner space

  - image: "images/outreach.jpg"
    pretitle: "Community"
    title: "Fostering connections, expanding learning opportunities, and being open to anyone."
    text: "By expanding into new communities, our outreach supports other local groups or makerspaces in realizing their dreams. We offer resources, a framework, and potential funding to help in their pursuit of community driven spaces, because we are all a community."

    # buttons:
    #   - label: "Read more"
    #     url: "/community/"
# "/community/" lists all significant community projects and events we've organized/participated in

  - image: "images/creativity.jpg"
    pretitle: "Creativity"
    title: "Inspiring New Ways of Approaching Ideas"
    text: "We offer an evolving schedule of carefully designed workshops to give participants the best oppurtunity to express their full creativity. With these workshops, we hope to provide a foundation of knowledge and motivation to start or grow each member's passion for creation. We are always developing new techniques that lead to innovative problem solving."

