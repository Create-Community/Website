id: "portfolio"

content:
  - image: "images/workspaces.jpg"
    pretitle: "Workspaces"
    title: "Collaboratively driven workspaces with a focus on accessibility through technology."
    text: "We strive to bring dynamic workspaces to areas that would benefit from them the most. We hope to bring creative third-spaces to neighbourhoods where work space at home is limited. With software  developed in-house, we give every member full access to our active tool and material inventory, as well as a method of reserving private work stations."

    # buttons:
